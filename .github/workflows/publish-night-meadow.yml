name: Publish Night Meadow site

on:
  push:
    paths:
      - .github/workflows/publish-night-meadow.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Check out the prepared Night Meadow site
        uses: actions/checkout@v4
        with:
          repository: XiZhou98/Wenjinlab.github.io
          ref: main
          path: source

      - name: Synchronize site files while preserving production-only assets
        run: |
          rsync -a --exclude='.git/' source/ target/
          rm -f target/.github/workflows/publish-night-meadow.yml

      - name: Publish to the production main branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Night Meadow site, members, and publications"
          git push
